msstc4symfony_slo:
  operations:
    orders.search_index:
      objectives:
        - { type: availability, target: 99 }
        - { type: latency, threshold: 100ms, target: 99 }
  generation:
    alertmanager: { enabled: true }
    # global.scrape_interval of docker/observability/prometheus.yml; slo:validate checks task deadlines against it.
    prometheus: { scrape_interval_seconds: 5 }
    selector:
      application: showcase
      components: [orders]
