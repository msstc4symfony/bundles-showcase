monolog:
  handlers:
    # stdout is the RoadRunner worker protocol channel: logs go to stderr (RoadRunner logs.mode: raw).
    main:
      type: stream
      path: php://stderr
      level: info
      channels: ["!event", "!deprecation"]
      formatter: Msstc4Symfony\LoggerBundle\Framework\Monolog\Formatter\SwitchFormatter
    # The same records over OTLP (tracing-bridge-otlp logs), in the trace context of the span they were written in.
    otlp:
      type: service
      id: msstc4symfony_tracing_bridge_otlp.logs_handler
      channels: ["!event", "!deprecation"]

when@test:
  monolog:
    handlers:
      main:
        type: test
