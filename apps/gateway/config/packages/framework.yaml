# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            orders.client:
                base_uri: '%env(ORDERS_URL)%'
                timeout: 5
                # Must stay below IdempotencyStore's 30 s lock TTL, or a slow call lets a duplicate in.
                max_duration: 10

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        http_client:
            mock_response_factory: App\Tests\Support\OrdersStub
