  - interval: 5m
    name: slo-gateway.create_order-window
    rules:
      - expr: 'sum(rate(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915"}[3d]))'
        labels:
          application: showcase
          objective: availability
          revision: 0ea7a915
          slo: gateway.create_order
          window: 30d
        record: 'slo:events:rate3d'
      - expr: '(sum(rate(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915",result="bad"}[3d])) or vector(0)) / (sum(rate(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915"}[3d])) > 0)'
        labels:
          application: showcase
          objective: availability
          revision: 0ea7a915
          slo: gateway.create_order
          window: 30d
        record: 'slo:error_ratio:rate3d'
      - expr: '1 - ((sum(increase(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915",result="bad"}[30d])) or vector(0)) / (sum(increase(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915"}[30d])) > 0))'
        labels:
          application: showcase
          objective: availability
          revision: 0ea7a915
          slo: gateway.create_order
          window: 30d
        record: 'slo:sli:ratio'
      - expr: '1 - (1 - slo:sli:ratio{application="showcase",slo="gateway.create_order",objective="availability"}) / 0.005'
        labels:
          application: showcase
          objective: availability
          revision: 0ea7a915
          slo: gateway.create_order
          window: 30d
        record: 'slo:error_budget:remaining'
      - expr: 'clamp((time() - min_over_time(timestamp(sum(symfony_slo_events_total{application="showcase",component=~"gateway",slo="gateway.create_order",objective="availability",revision="0ea7a915"}))[721h:1h])) / 2592000, 0, 1)'
        labels:
          application: showcase
          objective: availability
          revision: 0ea7a915
          slo: gateway.create_order
          window: 30d
        record: 'slo:window:coverage_ratio'
