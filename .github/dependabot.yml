version: 2
updates:
  - package-ecosystem: composer
    directories: ["/apps/gateway", "/apps/orders", "/apps/billing", "/e2e", "/"]
    schedule:
      interval: daily
    groups:
      msstc4symfony:
        patterns: ["msstc4symfony/*"]
      symfony:
        patterns: ["symfony/*"]
  - package-ecosystem: docker
    directories: ["/docker/php"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories: ["/"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
