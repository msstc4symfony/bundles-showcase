name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # bundle-updates gates a commit on its own branch before fast-forwarding main.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: docker compose up --build --wait --wait-timeout 300
      - run: docker compose run --rm --build e2e --tags='~@chaos' --format=progress
      - run: docker compose run --rm e2e --tags='@chaos' --format=progress
      - if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 14
