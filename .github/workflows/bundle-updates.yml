name: bundle-updates

# Dependabot does not see releases of the msstc4symfony bundles (they come from vcs repositories), and
# GITHUB_TOKEN may not open pull requests in this organisation. So this workflow commits the update to the
# bundle-updates branch, gates that commit with quality and e2e, and fast-forwards main when both pass.
# A failed gate leaves the branch in place; the run fails and its summary names the update (issues are off here).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      summary: ${{ steps.update.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis, amqp, intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Update msstc4symfony bundles in every app
        id: update
        run: |
          {
            echo 'summary<<EOF'
            for app in apps/gateway apps/orders apps/billing; do
              before=$(composer --working-dir=$app show 'msstc4symfony/*' --locked --format=json | jq -r '.installed[] | "\(.name) \(.version)"' | sort)
              composer --working-dir=$app update 'msstc4symfony/*' --with-dependencies --no-interaction --no-scripts --no-progress
              after=$(composer --working-dir=$app show 'msstc4symfony/*' --locked --format=json | jq -r '.installed[] | "\(.name) \(.version)"' | sort)
              diff <(echo "$before") <(echo "$after") | sed -n "s|^> |- $app: |p"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Commit to the bundle-updates branch
        id: commit
        run: |
          if git diff --quiet; then
            echo 'No bundle releases since the last update.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam 'Update msstc4symfony bundles'
          git push --force origin HEAD:refs/heads/bundle-updates
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: update
    if: needs.update.outputs.sha != ''
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  e2e:
    needs: update
    if: needs.update.outputs.sha != ''
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  merge:
    needs: [update, quality, e2e]
    if: needs.update.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.sha }}
      # A plain push: GitHub rejects it unless main is still the parent of the gated commit.
      - run: git push origin HEAD:refs/heads/main
      - run: git push origin --delete bundle-updates

  report:
    needs: [update, quality, e2e, merge]
    if: always() && needs.update.outputs.sha != '' && needs.merge.result != 'success'
    runs-on: ubuntu-latest
    env:
      SUMMARY: |
        ### Bundle update not merged

        Commit `${{ needs.update.outputs.sha }}` stays on the `bundle-updates` branch
        (quality: ${{ needs.quality.result }}, e2e: ${{ needs.e2e.result }}, merge: ${{ needs.merge.result }}).

        ${{ needs.update.outputs.summary }}
    steps:
      - run: |
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          exit 1
