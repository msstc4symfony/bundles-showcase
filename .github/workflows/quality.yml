name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: PHPStan + PHPUnit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, orders, billing]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: showcase, POSTGRES_PASSWORD: showcase, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U showcase" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis, amqp, intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: php bin/console cache:warmup --env=test
      - if: hashFiles(format('apps/{0}/migrations', matrix.app)) != ''
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test -n
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: vendor/bin/phpunit

  style:
    name: PHP-CS-Fixer + Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: |
          for app in gateway orders billing; do
            (cd apps/$app && composer install --prefer-dist --no-progress --no-interaction)
          done
      - run: vendor/bin/php-cs-fixer check
      - run: vendor/bin/rector process --dry-run
