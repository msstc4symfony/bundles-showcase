# Generated by make slo-generate (docker/observability/assemble-alertmanager.php) from alertmanager.base.yml
# and apps/gateway/infrastructure/observability/alertmanager/slo-alertmanager-routes.yml. Do not edit.
route:
  receiver: "null"
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - group_by:
        - application
        - slo
        - objective
      matchers:
        - 'alertname=~"SloErrorBudgetBurn|SloNoEvents"'
        - 'application="showcase"'
      routes:
        - matchers:
            - 'severity="page"'
          receiver: slo-page
        - matchers:
            - 'severity="ticket"'
          receiver: slo-ticket
receivers:
  - name: "null"
  - name: slo-page
    webhook_configs:
      - url: http://alert-recorder:8080/slo-page
        send_resolved: true
  - name: slo-ticket
    webhook_configs:
      - url: http://alert-recorder:8080/slo-ticket
        send_resolved: true
inhibit_rules:
  - equal:
      - application
      - slo
      - objective
    source_matchers:
      - 'alertname="SloErrorBudgetBurn"'
      - 'severity="page"'
    target_matchers:
      - 'alertname="SloErrorBudgetBurn"'
      - 'severity="ticket"'
